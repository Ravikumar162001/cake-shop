name: Secret Scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Scans the checked-out working tree (not old history — the historical
      # leak is handled by rotating those credentials, so scanning history
      # would only produce permanent noise).
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --no-git --redact --verbose
